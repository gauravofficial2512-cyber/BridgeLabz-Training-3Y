<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;"><b>Student Registration Form</b></h1>
    <form>
        <table border="1" cellpadding="15px" cellspacing="1" style="margin:auto; width:50%">
            <thead >
                <tr>
                    <th colspan="2"><b>Registration Form</b></th>
                </tr>

            </thead>
            <tbody>
                <tr>
                    <td>Full Name</td>
                    <td>
                        <input type="text" placeholder="enter your name">
                    </td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td>
                        <input type="text" placeholder="abc@gmail.com">
                    </td>
                </tr>
                <tr>
                    <td>Phone Number</td>
                    <td>
                        <input type="text" placeholder="9711041832">
                    </td>
                </tr>
                <tr>
                    <td>Date Of Birth</td>
                    <td>
                        <input type="date">
                    </td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" name="gend">Male
                        <input type="radio" name="gend">Female
                        <input type="radio" name="gend">Ohter
                    </td>
                </tr>
                <tr>
                    <td>Skills</td>
                    <td>
                        <input type="radio" name="s">HTML 
                        <input type="radio" name="s">CSS
                        <input type="radio" name="s">Java Script
                    </td>
                </tr>
                <tr>
                    <td>Course</td>
                    <td>
                        <select name="course">
                            <option val="c">Select Course</option>
                            <option val="btech">Bachelor Of Technology</option>
                            <option val="bba">Bachelor Of Buisness Administration</option>
                            <option val="bca">Bachelor of computer application</option>
                            <option val="bed">Bachelor Of Education</option>
                            <option vla="bsc">Bachelor of Basic Sciences</option>
                            <option val="mtech">Masters Of Technology</option>
                            <option val="mba">Masters of Buisness Administration</option>
                            <option val="mca">Masters Of computer application</option>
                            <option val="med">Master of Education</option>
                            <option val="msc">Master of Basic Sciences</option>
                        </select>
                    </td>

                </tr>
                <tr>
                    <td>Address</td>
                    <td>
                        <textarea rowss="15" cols="30" placeholder="Enter Address"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Upload Resume</td>
                    <td>
                        <input type="file">
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <button  type="submit">Register</button>
                        <button  type="reset">Reset</button>
                    </td>
                </tr>
            </tfoot>
        </table>
    </form>
</body>
</html>
