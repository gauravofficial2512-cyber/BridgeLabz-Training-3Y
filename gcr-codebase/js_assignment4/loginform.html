
<!DOCTYPE html>
<html>
<body>
    <h2>Login Form</h2>

    <form id="form">
        <input id="user" placeholder="Username"><br><br>
        <input id="pass" type="password" placeholder="Password"><br><br>
        <button>Login</button>
    </form>

    <p id="msg"></p>

    <script >
        
let form = document.getElementById("form");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;
    let msg = document.getElementById("msg");

    let r1 = /^.{5,}$/;
    let r2 = /^(?=.*[0-9])(?=.*[A-Z])(?=.*[a-z])(?=.*[^A-Za-z0-9]).{8,}$/;

    if (!r1.test(user)) {
        msg.textContent = "Username must have at least 5 characters";
        msg.style.color = "red";
    } else if (!r2.test(pass)) {
        msg.textContent = "Password must have 8 characters, uppercase, lowercase, number and special character";
        msg.style.color = "red";
    } else {
        msg.textContent = "Login Successful";
        msg.style.color = "green";
    }
});

    </script>
</body>
</html>
