<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post">
        <table border="1" cellpadding="10" cellspacing="1" style="margin:auto;">
            <tr>
                <th colspan="2">Payment Form</th>
            </tr>
            <tr>
                <td>Cardholder Name</td>
                <td>
                    <input type="text" required placeholder="rahul">
                </td>
            </tr>
            <tr>
                <td>Card Number</td>
                <td>
                    <input type="text" required>
                </td>
            </tr>
            <tr>
                <td>Expiry Date</td>
                <td>
                    <input type="date" required>
                </td>
            </tr>
            <tr>
                <td>CVV</td>
                <td>
                    <input type="text" required>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit" style="margin-left:120px;">Pay Now</button>
                </td>
                
            </tr>
        </table>
    </form>
</body>
</html>
