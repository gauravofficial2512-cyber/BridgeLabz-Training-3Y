<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <form action="#" method="post">
        <table border="1" cellpadding="10" cellspacing="1" style="margin:auto;">
            <tr>
                <th colspan="2">Contact Form</th>
            </tr>
            <tr>
                <td>Full name</td>
                <td>
                    <input type="text" placeholder="Gaurav Prajapati" required>
                </td>
            </tr>
            <tr>
                <td>Email</td>
                <td>
                    <input type="email" placeholder="abc@gmail.com" required>
                </td>
            </tr>
            <tr>
                <td>Subject</td>
                <td>
                    <input type="text" placeholder="Deep Learning" required>
                </td>
            </tr>
            <tr>
                <td>Message</td>
                <td>
                    <textarea rows="3" cols="20"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit" style="margin-left:100px;">Submit</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
