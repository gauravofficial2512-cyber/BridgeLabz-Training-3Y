<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form</title>
</head>
<body>
    <form action="result.html" method="get" target="resultFrame">
        <table border="1" cellpadding="10" cellspacing="1" style="margin:auto;">
            <tr>
                <td>Write Your Feedback</td>
                <td>
                    <textarea cols="19" rows="4"></textarea>
                </td>
            </tr>
            <tr>
                <td>Rating</td>
                <td>
                    <input type="radio" name="r">Good <input type="radio" name="r">Average <input type="radio" name="r">Poor

                </td>

            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit" style="margin-left:100px;">Submit</button>
                </td>
            </tr>
        </table>
    </form>
    <br>
    <iframe name="resultFrame" width="400" height="100"></iframe>
</body>
</html>
